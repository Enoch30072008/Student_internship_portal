<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="pro.css">
</head>
<body>
    <div class="app">
    <header class="top">

    <div class="brand"><h1>Student</h1> <span>Internships</span></div>

     <div class="tabs">

     
       <button >Home</button>
       <button >Browse</button>
       <button >My Applications</button>
       <button class="profile" >Profile</button>

     </div>
     </header>

    <section class="view" id="profile">
    <div class="section-head"><h3>My profile</h3></div>
    <div class="profile-card">
    <label>Full name<input id="name" type="text" placeholder="Jordan Alvarez"></label>
    <label>School<input id="school" type="text" placeholder="University of Michigan"></label>
    <label>Major<input id="major" type="text" placeholder="Computer Science"></label>
    <label>Graduation year<input id="year" type="text" placeholder="2027"></label>
    <label>Resume link<input id="resume" type="text" placeholder="https://drive.google.com/..."></label>
    <label>Skills<textarea id="skills" rows="2" placeholder="Python, React, data analysis"></textarea></label>
    <button class="btn small">Save profile</button>
    <span id="p-saved" class="p-saved-note"></span>
    </div>
</section>
    
</body>
</html>
